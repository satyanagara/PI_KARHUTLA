# Tahap awal (sebelum sertifikat terbit): HTTP saja + jalur ACME untuk certbot.
upstream pemantau_karhutla {
    server 10.129.90.36:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name amukapi.santaralabs.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /var/log/nginx/amukapi.santaralabs.ai.access.log;
    error_log  /var/log/nginx/amukapi.santaralabs.ai.error.log;

    location / {
        proxy_pass http://pemantau_karhutla;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 120s;
    }
}
