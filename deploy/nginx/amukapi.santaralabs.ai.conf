# Server aplikasi (10.129.90.36, IP publik 103.138.205.33): HTTP dialihkan ke HTTPS, sertifikat Let's Encrypt.
server {
    listen 80;
    listen [::]:80;
    server_name amukapi.santaralabs.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amukapi.santaralabs.ai;

    ssl_certificate     /etc/letsencrypt/live/amukapi.santaralabs.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amukapi.santaralabs.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/amukapi.santaralabs.ai/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:AMUKAPI:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/amukapi.santaralabs.ai.access.log;
    error_log  /var/log/nginx/amukapi.santaralabs.ai.error.log;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_read_timeout 120s;
    }
}
