# Podman:
#   pengembangan : podman compose up dev        → http://localhost:5173
#   produksi     : podman compose up -d app     → http://localhost:8787
services:
  dev:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_HOST: 0.0.0.0
      VITE_POLL: "1"
    env_file:
      - path: .env.local
        required: false
    ports:
      - "5173:5173"
      - "8787:8787"
    volumes:
      - .:/app:z
      # node_modules Linux terpisah dari node_modules macOS di host.
      - node_modules:/app/node_modules

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/pemantau-karhutla:latest
    env_file:
      - path: .env.local
        required: false
    environment:
      TRUST_PROXY: "1"
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  node_modules:
